<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements - G_S demon list</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#1e1e1e;scroll-behavior:smooth}
body{min-height:100vh;background:#1e1e1e;color:#fff;font-family:'Montserrat',sans-serif;overflow-x:hidden;position:relative}
.barra-sinistra,.barra-destra{position:absolute;top:0;bottom:0;width:30vw;min-height:100%;background-image:url("./miguel.png");background-repeat:repeat-y;background-size:100% auto;background-position:top center;opacity:.75;pointer-events:none;z-index:0}
.barra-sinistra{left:0} .barra-destra{right:0;transform:scaleX(-1)}
main{position:relative;z-index:1;min-height:100vh;padding:35px 0 90px}
.navigation-badges{display:flex;align-items:center;justify-content:center;gap:12px;width:min(900px,88%);margin:0 auto 25px;flex-wrap:wrap;position:relative;z-index:10}
.dropdown-container{position:relative;display:inline-block}
.badge-link{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;background:rgba(32,32,32,.97);border:1px solid #3b3b3b;border-left:3px solid #e85a5a;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.18);text-decoration:none;color:#f5f5f5;font-size:.8rem;font-weight:700;letter-spacing:.5px;transition:.22s;cursor:pointer}
.badge-link:hover{transform:translateY(-2px);background:rgba(42,42,42,.99);border-color:#555;border-left-color:#ff5555}
.badge-link img{width:24px;height:24px;object-fit:cover;border-radius:5px;border:1px solid #555;background:#252525}
.arrow{font-size:.75rem;font-weight:800;color:#999;transition:.25s;display:inline-block}
.dropdown-container:hover .arrow{transform:rotate(90deg);color:#ff5555}
.dropdown-menu{position:absolute;top:100%;left:50%;padding-top:10px;min-width:175px;z-index:100;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(-12px) scale(.96);transition:opacity .25s,transform .3s,visibility 0s linear .3s}
.dropdown-container:hover .dropdown-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1);transition:opacity .25s,transform .3s,visibility 0s}
.dropdown-content{background:rgba(28,28,28,.98);border:1px solid #3b3b3b;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);padding:8px 0;display:flex;flex-direction:column}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#f5f5f5;text-decoration:none;font-size:.78rem;font-weight:700;opacity:0;transform:translateX(-12px);transition:.2s}
.dropdown-container:hover .dropdown-item{opacity:1;transform:translateX(0)}
.dropdown-item:hover{background:rgba(229,72,72,.15);color:#ff5555}
.dropdown-item img{width:22px;height:22px;object-fit:cover;border-radius:4px;border:1px solid #555;background:#252525}
header{text-align:center;padding:0 15px}
.testo-illuminato{color:#fff;font-size:clamp(2.1rem,5vw,3.4rem);font-weight:800;letter-spacing:-1.5px;text-shadow:0 0 25px rgba(255,255,255,.13)}
.sottotitolo{margin-top:14px;color:#999;font-size:clamp(.75rem,1.5vw,.95rem);font-weight:500;letter-spacing:2.5px;line-height:1.8}
.linea-titolo{width:75px;height:3px;margin:22px auto 0;border-radius:10px;background:#e54848;box-shadow:0 0 14px rgba(229,72,72,.45)}
.classifica{position:relative;z-index:2;width:min(900px,88%);margin:40px auto 0;display:flex;flex-direction:column;gap:14px}
.livello{position:relative;display:flex;flex-direction:column;gap:10px;min-height:90px;padding:18px 22px;background:rgba(32,32,32,.97);border:1px solid #3b3b3b;border-left:4px solid #00e676;border-radius:10px;box-shadow:0 5px 18px rgba(0,0,0,.18);transition:.22s}
.livello:hover{transform:translateY(-3px);background:rgba(42,42,42,.99);border-color:#555;border-left-color:#00ff88}
.livello .meta{color:#00e676;font-size:.7rem;font-weight:700;letter-spacing:1.5px}
.livello h2{color:#f5f5f5;font-size:1.15rem;font-weight:800}
.livello p{color:#bbb;font-size:.85rem;line-height:1.6;white-space:pre-wrap}
.admin-btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(32,32,32,.97);border:1px solid #3b3b3b;border-left:3px solid #e85a5a;border-radius:20px;padding:9px 18px;color:#f5f5f5;font-weight:700;cursor:pointer}
#adminPanel{display:none;width:min(900px,88%);margin:0 auto 20px;background:rgba(32,32,32,.97);border:1px solid #3b3b3b;border-left:4px solid #00e676;border-radius:10px;padding:18px}
#adminPanel input,#adminPanel textarea{width:100%;background:#1e1e1e;color:#fff;border:1px solid #3b3b3b;border-radius:8px;padding:10px;margin:5px 0;font-family:'Montserrat'}
#adminPanel button{background:#00e676;color:#000;border:0;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer;margin-top:6px}
footer{position:relative;z-index:2;text-align:center;color:#666;font-size:.75rem;letter-spacing:1px;padding:25px 10px 35px}
@media(max-width:700px){.barra-sinistra,.barra-destra{width:22vw;opacity:.45} .classifica{width:95%}}
</style>
</head>
<body>
<div class="barra-sinistra"></div>
<div class="barra-destra"></div>
<main>
<nav class="navigation-badges">
<div class="dropdown-container">
<a class="badge-link"><img src="players.png"><span>Players</span><span class="arrow">></span></a>
<div class="dropdown-menu"><div class="dropdown-content">
<a href="who.html" class="dropdown-item"><span>❓ Who?</span></a>
<a href="leaderboard.html" class="dropdown-item"><img src="lb.png"><span>Leaderboard</span></a>
</div></div></div>
<div class="dropdown-container">
<a class="badge-link"><img src="games.png"><span>Games</span><span class="arrow">></span></a>
<div class="dropdown-menu"><div class="dropdown-content">
<a href="horse.html" class="dropdown-item"><img src="horse.png"><span>H.O.R.S.E.</span></a>
<a href="thedemonwheel.html" class="dropdown-item"><img src="tdw.png"><span>The Demon Wheel</span></a>
<a href="roulette.html" class="dropdown-item"><img src="roulette.png"><span>Roulette</span></a>
</div></div></div>
<a href="announcements.html" class="badge-link"><img src="announcements.png"><span>Announcements</span></a>
</nav>
<header>
<h1 class="testo-illuminato">ANNOUNCEMENTS</h1>
<p class="sottotitolo">LIVE • Home of the gooners' demonlist</p>
<div class="linea-titolo"></div>
</header>
<div id="adminPanel">
<h3 style="color:#00e676;margin-bottom:8px">CONTROL PANEL</h3>
<input id="email" value="lorecatels22@gmail.com"><input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button><button id="logoutBtn" style="display:none;background:#222;color:#fff;border:1px solid #444">Logout</button>
<div id="loginStatus" style="color:#888;font-size:12px;margin:8px 0">Not logged</div>
<div id="postForm" style="display:none">
<input id="tag" placeholder="Tag - NEWS"><input id="title" placeholder="Titolo"><textarea id="text" rows="4" placeholder="Testo"></textarea>
<button id="publishBtn">Publish</button>
</div>
</div>
<section class="classifica" id="list">Loading...</section>
</main>
<footer>G_S demon list</footer>
<button class="admin-btn" id="adminToggle">ADMIN</button>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBLKY1OEOA2-5eJObCjJMeKCasSLf8WmrU",
  authDomain: "gs-demonlist.firebaseapp.com",
  databaseURL: "https://gs-demonlist-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gs-demonlist",
  storageBucket: "gs-demonlist.firebasestorage.app",
  messagingSenderId: "789414584664",
  appId: "1:789414584664:web:634d9f1b5dc16f10f6c52d",
  measurementId: "G-1V7VX6QRHZ"
};
const ADMIN_UID = "fuJ0msz9njbbD2Ra85CjurHM0qR2";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const listEl = document.getElementById('list');
const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
onSnapshot(q, (snap)=>{
  if(snap.empty){ listEl.innerHTML="<article class='livello'><h2>No announcements yet.</h2></article>"; return; }
  listEl.innerHTML="";
  snap.forEach(d=>{
    const data=d.data();
    const date=data.createdAt?.toDate ? data.createdAt.toDate().toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'}) : "";
    listEl.innerHTML+=`<article class="livello"><div class="meta">${(data.tag||'NEWS')} • ${date}</div><h2>${data.title||''}</h2><p>${data.text||''}</p>${auth.currentUser?.uid===ADMIN_UID?`<button style="margin-top:8px;background:#220000;color:#ff7777;border:1px solid #f00;border-radius:6px;padding:5px 10px;cursor:pointer" onclick="window.delAnn('${d.id}')">Delete</button>`:''}</article>`;
  });
});
window.delAnn=async(id)=>{ if(confirm("Eliminare?")) await deleteDoc(doc(db,"announcements",id)); }
document.getElementById('adminToggle').onclick=()=>{ const p=document.getElementById('adminPanel'); p.style.display=p.style.display==='none'?'block':'none'; }
document.getElementById('loginBtn').onclick=async()=>{ try{ await signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('password').value);}catch(e){document.getElementById('loginStatus').innerText=e.message;}};
document.getElementById('logoutBtn').onclick=()=>signOut(auth);
document.getElementById('publishBtn').onclick=async()=>{ const tag=document.getElementById('tag').value||"NEWS", title=document.getElementById('title').value, text=document.getElementById('text').value; if(!title||!text) return alert("Titolo e testo obbligatori"); await addDoc(collection(db,"announcements"),{tag,title,text,createdAt:serverTimestamp()}); document.getElementById('title').value=""; document.getElementById('text').value=""; };
onAuthStateChanged(auth,(user)=>{ const s=document.getElementById('loginStatus'), f=document.getElementById('postForm'), lb=document.getElementById('loginBtn'), lob=document.getElementById('logoutBtn'); if(user&&user.uid===ADMIN_UID){ s.innerText="Admin: "+user.email; f.style.display="block"; lb.style.display="none"; lob.style.display="block"; } else if(user){ s.innerText="Non sei admin"; f.style.display="none"; } else{ s.innerText="Not logged"; f.style.display="none"; lb.style.display="block"; lob.style.display="none"; } });
</script>
</body>
</html>
