<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements - G_S Demon List</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
.side-img{position:fixed;top:0;width:30vw;height:100vh;object-fit:cover;opacity:0.75;pointer-events:none;z-index:0}
.side-left{left:0} .side-right{right:0}
.content{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:40px 20px;min-height:100vh}
h1{text-align:center;font-size:48px;margin:0 0 10px}
.live{color:#0f0;text-align:center;margin-bottom:30px}
.card{background:rgba(20,20,20,0.9);border:1px solid #333;border-radius:12px;padding:20px;margin-bottom:20px}
.admin-btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border:1px solid #444;padding:10px 20px;border-radius:20px;cursor:pointer;z-index:10}
#adminPanel{display:none;background:#0f2a0f;border:1px solid #0f0;padding:20px;border-radius:12px;margin-bottom:20px}
input,textarea{width:100%;background:#111;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;margin:5px 0;box-sizing:border-box}
</style>
</head>
<body>
<img class="side-img side-left" src="https://cdn.discordapp.com/attachments/1316142784937943060/1405407827075887174/2d7c9e0f6be8d45c7d7f38bece6c67d9.png">
<img class="side-img side-right" src="https://cdn.discordapp.com/attachments/1316142784937943060/1405407827075887174/2d7c9e0f6be8d45c7d7f38bece6c67d9.png">
<div class="content">
<h1>ANNOUNCEMENTS</h1>
<div class="live">● LIVE</div>
<div id="adminPanel">
<h3>CONTROL PANEL</h3>
<input id="email" placeholder="Email" value="lorecatels22@gmail.com">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<button id="logoutBtn" style="display:none">Logout</button>
<div id="loginStatus"></div>
<div id="postForm" style="display:none">
<input id="tag" placeholder="Tag (NEWS, UPDATE...)">
<input id="title" placeholder="Title">
<textarea id="text" placeholder="Text"></textarea>
<button id="publishBtn">Publish</button>
</div>
</div>
<div id="list">Loading...</div>
</div>
<button class="admin-btn" id="adminToggle">ADMIN</button>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBYK10E0A2-SeJObCjMeKCasSLfWmrU",
  authDomain: "gs-demonlist.firebaseapp.com",
  databaseURL: "https://gs-demonlist-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gs-demonlist",
  storageBucket: "gs-demonlist.firebasestorage.app",
  messagingSenderId: "789414584664",
  appId: "1:789414584664:web:634d9f1b5dc16f10f6c52d",
  measurementId: "G-1V7VX6QRHZ"
};
const ADMIN_UID = "fuJ0msz9njbbD2Ra85CjurHM0qR2";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const listEl = document.getElementById('list');
const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
onSnapshot(q, (snap)=>{
  if(snap.empty){ listEl.innerHTML = "No announcements yet."; return; }
  listEl.innerHTML = "";
  snap.forEach(d=>{
    const data = d.data();
    const date = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString() : "";
    listEl.innerHTML += `<div class="card"><div style="color:#0f0;font-size:12px">${data.tag||''} • ${date}</div><h3>${data.title||''}</h3><p>${data.text||''}</p>${auth.currentUser?.uid===ADMIN_UID?`<button onclick="window.delAnn('${d.id}')" style="background:#300;color:#f88;border:1px solid #f00;border-radius:6px;padding:4px 8px;cursor:pointer">Delete</button>`:''}</div>`;
  });
}, (err)=>{
  console.error(err);
  listEl.innerHTML = "Firestore error: "+err.message+"<br>Check Rules!";
});
window.delAnn = async (id)=>{ if(confirm("Delete?")) await deleteDoc(doc(db,"announcements",id)); }
document.getElementById('adminToggle').onclick = ()=>{ const p=document.getElementById('adminPanel'); p.style.display = p.style.display==='none'?'block':'none'; }
document.getElementById('loginBtn').onclick = async ()=>{
  const e=document.getElementById('email').value, pw=document.getElementById('password').value;
  try{ await signInWithEmailAndPassword(auth,e,pw); }catch(err){ document.getElementById('loginStatus').innerText = err.message; }
};
document.getElementById('logoutBtn').onclick = ()=>signOut(auth);
document.getElementById('publishBtn').onclick = async ()=>{
  const tag=document.getElementById('tag').value||"NEWS", title=document.getElementById('title').value, text=document.getElementById('text').value;
  if(!title||!text) return alert("Title and text required");
  await addDoc(collection(db,"announcements"),{tag,title,text,createdAt:serverTimestamp()});
  document.getElementById('title').value=""; document.getElementById('text').value="";
};
onAuthStateChanged(auth,(user)=>{
  const status=document.getElementById('loginStatus'), form=document.getElementById('postForm'), loginBtn=document.getElementById('loginBtn'), logoutBtn=document.getElementById('logoutBtn');
  if(user && user.uid===ADMIN_UID){ status.innerText="Admin: "+user.email; form.style.display="block"; loginBtn.style.display="none"; logoutBtn.style.display="block"; }
  else if(user){ status.innerText="Non sei admin: "+user.email; form.style.display="none"; }
  else{ status.innerText="Not logged"; form.style.display="none"; loginBtn.style.display="block"; logoutBtn.style.display="none"; }
});
</script>
</body>
</html>
