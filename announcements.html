<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements - G_S demon list</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#1e1e1e;scroll-behavior:smooth}
body{min-height:100vh;background:#1e1e1e;color:#fff;font-family:'Montserrat',sans-serif;overflow-x:hidden;position:relative}

/* ANIMAZIONI */
@keyframes fadeUp{from{opacity:0;transform:translateY(25px)} to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
@keyframes lineGrow{from{width:0} to{width:75px}}
@keyframes pulseLive{0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.7;transform:scale(1.05)}}
@keyframes floatBtn{0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-4px)}}

/* MIGUEL.PNG FERMO - NON SI MUOVE */
.barra-sinistra,.barra-destra{
position:fixed;top:0;bottom:0;width:30vw;min-height:100vh;
background-image:url("./miguel.png");background-repeat:repeat-y;background-size:100% auto;background-position:top center;
opacity:.75;pointer-events:none;z-index:0;
}
.barra-sinistra{left:0}
.barra-destra{right:0;transform:scaleX(-1)}

/* MAIN CENTRATO */
main{
position:relative;z-index:1;
width:100%;min-height:100vh;
padding:35px 0 90px;
display:flex;flex-direction:column;align-items:center;
}

/* NAV ANIMATA MA CENTRATA */
.navigation-badges{
display:flex;align-items:center;justify-content:center;gap:12px;
width:min(900px,88%);margin:0 auto 30px;flex-wrap:wrap;z-index:10
}
.navigation-badges .dropdown-container,.navigation-badges > a{animation:fadeUp .6s ease both}
.navigation-badges > *:nth-child(1){animation-delay:.1s} .navigation-badges > *:nth-child(2){animation-delay:.2s} .navigation-badges > *:nth-child(3){animation-delay:.3s}
.dropdown-container{position:relative;display:inline-block}
.badge-link{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;background:rgba(32,32,32,.97);border:1px solid #3b3b3b;border-left:3px solid #e85a5a;border-radius:20px;text-decoration:none;color:#f5f5f5;font-size:.8rem;font-weight:700;transition:all .25s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.badge-link:hover{transform:translateY(-3px) scale(1.03);background:rgba(42,42,42,.99);border-color:#666;border-left-color:#ff5555;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.badge-link img{width:24px;height:24px;object-fit:cover;border-radius:5px;border:1px solid #555;transition:.25s}
.badge-link:hover img{transform:scale(1.1) rotate(2deg)}
.arrow{font-size:.75rem;font-weight:800;color:#999;transition:.25s}
.dropdown-container:hover .arrow{transform:rotate(90deg);color:#ff5555}
.dropdown-menu{position:absolute;top:100%;left:50%;padding-top:10px;min-width:175px;z-index:100;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(-10px) scale(.96);transition:.3s cubic-bezier(.2,.8,.2,1)}
.dropdown-container:hover .dropdown-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
.dropdown-content{background:rgba(28,28,28,.98);border:1px solid #3b3b3b;border-radius:10px;padding:8px 0;display:flex;flex-direction:column}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#f5f5f5;text-decoration:none;font-size:.78rem;font-weight:700;transform:translateX(-8px);opacity:0;transition:.25s}
.dropdown-container:hover .dropdown-item{transform:translateX(0);opacity:1}
.dropdown-container:hover .dropdown-item:nth-child(1){transition-delay:.05s} .dropdown-container:hover .dropdown-item:nth-child(2){transition-delay:.1s} .dropdown-container:hover .dropdown-item:nth-child(3){transition-delay:.15s}
.dropdown-item:hover{background:rgba(229,72,72,.15);color:#ff5555;transform:translateX(4px)}

/* HEADER ANIMATO CENTRATO */
header{text-align:center;width:min(900px,88%);margin:0 auto;animation:fadeUp .7s ease .2s both}
.testo-illuminato{color:#fff;font-size:clamp(2.4rem,5vw,3.6rem);font-weight:900;letter-spacing:-1.5px;text-shadow:0 0 30px rgba(255,255,255,.15)}
.sottotitolo{margin-top:14px;color:#999;font-size:.95rem;font-weight:500;letter-spacing:2.5px;animation:fadeIn 1s ease .6s both}
.linea-titolo{width:75px;height:3px;margin:22px auto 0;border-radius:10px;background:#e54848;box-shadow:0 0 14px rgba(229,72,72,.45);animation:lineGrow .7s ease 1s both}
.live{margin-top:16px;color:#00e676;font-weight:800;letter-spacing:4px;font-size:.9rem;animation:pulseLive 2s ease-in-out infinite}

/* ANNUNCI ANIMATI CENTRATI */
.classifica{width:min(900px,88%);margin:40px auto 0;display:flex;flex-direction:column;gap:18px}
.livello{position:relative;display:flex;flex-direction:column;gap:10px;padding:22px 26px;background:linear-gradient(135deg,rgba(32,32,32,.97),rgba(30,30,30,.97));border:1px solid #3b3b3b;border-left:4px solid #00e676;border-radius:14px;box-shadow:0 5px 18px rgba(0,0,0,.18);opacity:0;animation:fadeUp .6s ease forwards;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.livello:hover{transform:translateY(-5px) scale(1.01);background:rgba(42,42,42,.99);border-color:#555;border-left-color:#00ff88;box-shadow:0 15px 40px rgba(0,0,0,.4),0 0 25px rgba(0,230,118,.12)}
.livello .meta{color:#00e676;font-size:.7rem;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.livello h2{color:#f5f5f5;font-size:1.25rem;font-weight:800;transition:.3s}
.livello:hover h2{letter-spacing:.2px;color:#fff}
.livello p{color:#bbb;font-size:.9rem;line-height:1.7;white-space:pre-wrap}
.livello:hover p{color:#ddd}

#adminPanel{width:min(900px,88%);margin:0 auto 25px;background:rgba(32,32,32,.97);border:1px solid #3b3b3b;border-left:4px solid #00e676;border-radius:12px;padding:18px;display:none;animation:fadeUp .4s ease}
#adminPanel input,#adminPanel textarea{width:100%;background:#1e1e1e;color:#fff;border:1px solid #3b3b3b;border-radius:8px;padding:11px;margin:6px 0;font-family:'Montserrat';transition:.2s}
#adminPanel input:focus,#adminPanel textarea:focus{border-color:#00e676;box-shadow:0 0 0 3px rgba(0,230,118,.15);outline:none}
#adminPanel button{background:#00e676;color:#000;border:0;border-radius:8px;padding:10px 16px;font-weight:800;cursor:pointer;transition:.2s}
#adminPanel button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,230,118,.3)}

.admin-btn{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(32,32,32,.97);border:1px solid #3b3b3b;border-left:3px solid #e85a5a;border-radius:20px;padding:11px 22px;color:#f5f5f5;font-weight:800;letter-spacing:1px;cursor:pointer;animation:floatBtn 3s ease-in-out infinite;transition:.25s}
.admin-btn:hover{background:#fff;color:#000;transform:translateX(-50%) translateY(-4px) scale(1.05)}

footer{width:min(900px,88%);margin:40px auto 0;text-align:center;color:#666;font-size:.75rem;letter-spacing:1px;padding:25px 10px;animation:fadeIn 1s ease 1.8s both}
@media(max-width:700px){.barra-sinistra,.barra-destra{width:22vw;opacity:.45} .classifica,#adminPanel,header,.navigation-badges,footer{width:95%}}
</style>
</head>
<body>
<div class="barra-sinistra"></div>
<div class="barra-destra"></div>
<main>
<nav class="navigation-badges">
<div class="dropdown-container"><a class="badge-link"><img src="players.png"><span>Players</span><span class="arrow">></span></a><div class="dropdown-menu"><div class="dropdown-content"><a href="who.html" class="dropdown-item">❓ Who?</a><a href="leaderboard.html" class="dropdown-item"><img src="lb.png"><span>Leaderboard</span></a></div></div></div>
<div class="dropdown-container"><a class="badge-link"><img src="games.png"><span>Games</span><span class="arrow">></span></a><div class="dropdown-menu"><div class="dropdown-content"><a href="horse.html" class="dropdown-item"><img src="horse.png"><span>H.O.R.S.E.</span></a><a href="thedemonwheel.html" class="dropdown-item"><img src="tdw.png"><span>The Demon Wheel</span></a><a href="roulette.html" class="dropdown-item"><img src="roulette.png"><span>Roulette</span></a></div></div></div>
<a href="announcements.html" class="badge-link"><img src="announcements.png"><span>Announcements</span></a>
</nav>

<header>
<h1 class="testo-illuminato">ANNOUNCEMENTS</h1>
<p class="sottotitolo">Home of the gooners' demonlist</p>
<div class="linea-titolo"></div>
<div class="live">● LIVE</div>
</header>

<div id="adminPanel">
<h3 style="color:#00e676;margin-bottom:10px">CONTROL PANEL</h3>
<input id="email" value="lorecatels22@gmail.com"><input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button><button id="logoutBtn" style="display:none;background:#222;color:#fff;border:1px solid #444">Logout</button>
<div id="loginStatus" style="color:#888;font-size:12px;margin:10px 0">Not logged</div>
<div id="postForm" style="display:none"><input id="tag" placeholder="NEWS"><input id="title" placeholder="Titolo"><textarea id="text" rows="4" placeholder="Testo"></textarea><br><button id="publishBtn">Publish</button></div>
</div>

<section class="classifica" id="list">Loading...</section>
<footer>G_S demon list</footer>
</main>
<button class="admin-btn" id="adminToggle">ADMIN</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBLKY1OEOA2-5eJObCjJMeKCasSLf8WmrU",
  authDomain: "gs-demonlist.firebaseapp.com",
  databaseURL: "https://gs-demonlist-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gs-demonlist",
  storageBucket: "gs-demonlist.firebasestorage.app",
  messagingSenderId: "789414584664",
  appId: "1:789414584664:web:634d9f1b5dc16f10f6c52d",
  measurementId: "G-1V7VX6QRHZ"
};
const ADMIN_UID = "fuJ0msz9njbbD2Ra85CjurHM0qR2";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const listEl = document.getElementById('list');
const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
onSnapshot(q, (snap)=>{
  if(snap.empty){ listEl.innerHTML="<article class='livello' style='opacity:1'><h2>No announcements yet.</h2></article>"; return; }
  listEl.innerHTML=""; let i=0;
  snap.forEach(d=>{
    const data=d.data();
    const date=data.createdAt?.toDate ? data.createdAt.toDate().toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'}) : "";
    const div=document.createElement('article');
    div.className='livello'; div.style.animationDelay=(i*0.12)+'s';
    div.innerHTML=`<div class="meta">${(data.tag||'NEWS')} • ${date}</div><h2>${data.title||''}</h2><p>${data.text||''}</p>${auth.currentUser?.uid===ADMIN_UID?`<button style="margin-top:10px;background:#220000;color:#ff7777;border:1px solid #f00;border-radius:8px;padding:6px 12px;cursor:pointer" onclick="window.delAnn('${d.id}')">Delete</button>`:''}`;
    listEl.appendChild(div); i++;
  });
});
window.delAnn=async(id)=>{ if(confirm("Eliminare?")) await deleteDoc(doc(db,"announcements",id)); }
document.getElementById('adminToggle').onclick=()=>{ const p=document.getElementById('adminPanel'); p.style.display=p.style.display==='none'?'block':'none'; }
document.getElementById('loginBtn').onclick=async()=>{ try{ await signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('password').value);}catch(e){document.getElementById('loginStatus').innerText=e.message;}};
document.getElementById('logoutBtn').onclick=()=>signOut(auth);
document.getElementById('publishBtn').onclick=async()=>{ const t=document.getElementById('tag').value||"NEWS", ti=document.getElementById('title').value, te=document.getElementById('text').value; if(!ti||!te) return alert("Titolo e testo"); await addDoc(collection(db,"announcements"),{tag:t,title:ti,text:te,createdAt:serverTimestamp()}); document.getElementById('title').value=""; document.getElementById('text').value=""; };
onAuthStateChanged(auth,(u)=>{ const s=document.getElementById('loginStatus'), f=document.getElementById('postForm'), lb=document.getElementById('loginBtn'), lob=document.getElementById('logoutBtn'); if(u&&u.uid===ADMIN_UID){ s.innerText="Admin: "+u.email; f.style.display="block"; lb.style.display="none"; lob.style.display="block"; } else if(u){ s.innerText="Non admin"; f.style.display="none"; } else{ s.innerText="Not logged"; f.style.display="none"; lb.style.display="block"; lob.style.display="none"; } });
</script>
</body>
</html>
