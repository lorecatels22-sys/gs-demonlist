<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements - G_S demon list</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#1e1e1e;scroll-behavior:smooth}
body{min-height:100vh;background:#1e1e1e;color:#fff;font-family:'Montserrat',sans-serif;overflow-x:hidden;position:relative}

/* ANIMAZIONI GLOBALI */
@keyframes fadeUp{from{opacity:0;transform:translateY(25px)} to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
@keyframes lineGrow{from{width:0;opacity:0} to{width:75px;opacity:1}}
@keyframes pulseLive{0%,100%{opacity:1;text-shadow:0 0 10px #00e676} 50%{opacity:.6;text-shadow:0 0 25px #00e676}}
@keyframes float{0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)}}
@keyframes shine{0%{background-position:-200% center} 100%{background-position:200% center}}
@keyframes glowBorder{0%,100%{box-shadow:0 5px 18px rgba(0,0,0,.18)} 50%{box-shadow:0 8px 30px rgba(0,230,118,.15)}}
@keyframes sideDrift{0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)}}

/* SFONDO LATERALE ANIMATO */
.barra-sinistra,.barra-destra{position:absolute;top:0;bottom:0;width:30vw;min-height:100%;background-image:url("./miguel.png");background-repeat:repeat-y;background-size:100% auto;background-position:top center;opacity:.75;pointer-events:none;z-index:0;animation:sideDrift 12s ease-in-out infinite}
.barra-sinistra{left:0} .barra-destra{right:0;transform:scaleX(-1);animation-delay:-6s}
.barra-destra{animation-name:sideDrift;}

/* CONTENUTO */
main{position:relative;z-index:1;min-height:100vh;padding:35px 0 90px}

/* NAV - ENTRATA A CASCATA */
.navigation-badges{display:flex;align-items:center;justify-content:center;gap:12px;width:min(900px,88%);margin:0 auto 25px;flex-wrap:wrap;position:relative;z-index:10}
.navigation-badges > *{animation:fadeUp .6s ease both}
.navigation-badges > *:nth-child(1){animation-delay:.1s} .navigation-badges > *:nth-child(2){animation-delay:.2s} .navigation-badges > *:nth-child(3){animation-delay:.3s}
.dropdown-container{position:relative;display:inline-block}
.badge-link{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;background:rgba(32,32,32,.97);border:1px solid #3b3b3b;border-left:3px solid #e85a5a;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.18);text-decoration:none;color:#f5f5f5;font-size:.8rem;font-weight:700;letter-spacing:.5px;transition:all .25s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.badge-link:hover{transform:translateY(-3px) scale(1.03);background:rgba(42,42,42,.99);border-color:#555;border-left-color:#ff5555;box-shadow:0 10px 25px rgba(229,72,72,.25)}
.badge-link img{width:24px;height:24px;object-fit:cover;border-radius:5px;border:1px solid #555;background:#252525;transition:.25s}
.badge-link:hover img{filter:brightness(1.3);transform:rotate(3deg) scale(1.1)}
.arrow{font-size:.75rem;font-weight:800;color:#999;transition:.25s;display:inline-block}
.dropdown-container:hover .arrow{transform:rotate(90deg);color:#ff5555}
.dropdown-menu{position:absolute;top:100%;left:50%;padding-top:10px;min-width:175px;z-index:100;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(-12px) scale(.96);transition:all .3s cubic-bezier(.2,.8,.2,1)}
.dropdown-container:hover .dropdown-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
.dropdown-content{background:rgba(28,28,28,.98);border:1px solid #3b3b3b;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);padding:8px 0;display:flex;flex-direction:column}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#f5f5f5;text-decoration:none;font-size:.78rem;font-weight:700;opacity:0;transform:translateX(-12px);transition:.25s}
.dropdown-container:hover .dropdown-item{opacity:1;transform:translateX(0)}
.dropdown-container:hover .dropdown-item:nth-child(1){transition-delay:.06s} .dropdown-container:hover .dropdown-item:nth-child(2){transition-delay:.12s} .dropdown-container:hover .dropdown-item:nth-child(3){transition-delay:.18s}
.dropdown-item:hover{background:rgba(229,72,72,.15);color:#ff5555;transform:translateX(4px)}

/* TESTATA ANIMATA */
header{text-align:center;padding:0 15px;animation:fadeUp .8s ease .4s both}
.testo-illuminato{color:#fff;font-size:clamp(2.1rem,5vw,3.4rem);font-weight:900;letter-spacing:-1.5px;text-shadow:0 0 25px rgba(255,255,255,.13);background:linear-gradient(100deg,#fff 30%,#aaa 50%,#fff 70%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;animation:shine 4s linear infinite}
.sottotitolo{margin-top:14px;color:#999;font-size:clamp(.75rem,1.5vw,.95rem);font-weight:500;letter-spacing:2.5px;line-height:1.8;animation:fadeIn 1s ease .8s both}
.linea-titolo{height:3px;margin:22px auto 0;border-radius:10px;background:#e54848;box-shadow:0 0 14px rgba(229,72,72,.45);animation:lineGrow .8s ease 1s both}
.live{display:inline-block;margin-top:18px;color:#00e676;font-weight:800;letter-spacing:4px;font-size:.9rem;animation:pulseLive 2s ease-in-out infinite}

/* LISTA ANNUNCI CON ENTRATA A CASCATA */
.classifica{position:relative;z-index:2;width:min(900px,88%);margin:40px auto 0;display:flex;flex-direction:column;gap:18px}
.livello{position:relative;display:flex;flex-direction:column;gap:10px;min-height:90px;padding:20px 24px;background:linear-gradient(135deg,rgba(32,32,32,.97),rgba(28,28,28,.97));border:1px solid #3b3b3b;border-left:4px solid #00e676;border-radius:14px;box-shadow:0 5px 18px rgba(0,0,0,.18);transition:all .35s cubic-bezier(.2,.8,.2,1);opacity:0;animation:fadeUp .6s ease forwards, glowBorder 4s ease-in-out infinite}
.livello:nth-child(1){animation-delay:.2s} .livello:nth-child(2){animation-delay:.3s} .livello:nth-child(3){animation-delay:.4s} .livello:nth-child(4){animation-delay:.5s} .livello:nth-child(5){animation-delay:.6s}
.livello:hover{transform:translateY(-6px) scale(1.01);background:linear-gradient(135deg,rgba(42,42,42,.99),rgba(36,36,36,.99));border-color:#555;border-left-color:#00ff88;box-shadow:0 15px 40px rgba(0,0,0,.35),0 0 20px rgba(0,230,118,.15)}
.livello .meta{color:#00e676;font-size:.7rem;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.livello h2{color:#f5f5f5;font-size:1.25rem;font-weight:800;transition:.3s}
.livello:hover h2{color:#fff;letter-spacing:.3px}
.livello p{color:#bbb;font-size:.88rem;line-height:1.7;white-space:pre-wrap;transition:.3s}
.livello:hover p{color:#ddd}

.admin-btn{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(32,32,32,.97);border:1px solid #3b3b3b;border-left:3px solid #e85a5a;border-radius:20px;padding:10px 20px;color:#f5f5f5;font-weight:800;letter-spacing:1px;cursor:pointer;animation:float 3s ease-in-out infinite;transition:.25s}
.admin-btn:hover{transform:translateX(-50%) translateY(-3px) scale(1.05);box-shadow:0 10px 25px rgba(229,72,72,.3);background:#fff;color:#000}

#adminPanel{display:none;width:min(900px,88%);margin:0 auto 25px;background:rgba(32,32,32,.97);border:1px solid #3b3b3b;border-left:4px solid #00e676;border-radius:12px;padding:20px;animation:fadeUp .4s ease}
#adminPanel input,#adminPanel textarea{width:100%;background:#1e1e1e;color:#fff;border:1px solid #3b3b3b;border-radius:8px;padding:11px;margin:6px 0;font-family:'Montserrat';transition:.2s}
#adminPanel input:focus,#adminPanel textarea:focus{outline:none;border-color:#00e676;box-shadow:0 0 0 3px rgba(0,230,118,.15)}
#adminPanel button{background:#00e676;color:#000;border:0;border-radius:8px;padding:10px 16px;font-weight:800;cursor:pointer;margin-top:8px;transition:.2s}
#adminPanel button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,230,118,.3);background:#00ff88}

footer{position:relative;z-index:2;text-align:center;color:#666;font-size:.75rem;letter-spacing:1px;padding:25px 10px 35px;animation:fadeIn 1s ease 1.5s both}
@media(max-width:700px){.barra-sinistra,.barra-destra{width:22vw;opacity:.45} .classifica{width:95%}}
</style>
</head>
<body>
<div class="barra-sinistra"></div>
<div class="barra-destra"></div>
<main>
<nav class="navigation-badges">
<div class="dropdown-container">
<a class="badge-link"><img src="players.png"><span>Players</span><span class="arrow">></span></a>
<div class="dropdown-menu"><div class="dropdown-content">
<a href="who.html" class="dropdown-item"><span>❓ Who?</span></a>
<a href="leaderboard.html" class="dropdown-item"><img src="lb.png"><span>Leaderboard</span></a>
</div></div></div>
<div class="dropdown-container">
<a class="badge-link"><img src="games.png"><span>Games</span><span class="arrow">></span></a>
<div class="dropdown-menu"><div class="dropdown-content">
<a href="horse.html" class="dropdown-item"><img src="horse.png"><span>H.O.R.S.E.</span></a>
<a href="thedemonwheel.html" class="dropdown-item"><img src="tdw.png"><span>The Demon Wheel</span></a>
<a href="roulette.html" class="dropdown-item"><img src="roulette.png"><span>Roulette</span></a>
</div></div></div>
<a href="announcements.html" class="badge-link"><img src="announcements.png"><span>Announcements</span></a>
</nav>

<header>
<h1 class="testo-illuminato">ANNOUNCEMENTS</h1>
<p class="sottotitolo">Home of the gooners' demonlist</p>
<div class="linea-titolo"></div>
<div class="live">● LIVE</div>
</header>

<div id="adminPanel">
<h3 style="color:#00e676;margin-bottom:10px">⚡ CONTROL PANEL</h3>
<input id="email" value="lorecatels22@gmail.com"><input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button><button id="logoutBtn" style="display:none;background:#222;color:#fff;border:1px solid #444">Logout</button>
<div id="loginStatus" style="color:#888;font-size:12px;margin:10px 0">Not logged</div>
<div id="postForm" style="display:none">
<input id="tag" placeholder="Tag - NEWS / UPDATE / EVENT"><input id="title" placeholder="Titolo epico..."><textarea id="text" rows="4" placeholder="Scrivi l'annuncio..."></textarea>
<button id="publishBtn">🚀 Publish</button>
</div>
</div>

<section class="classifica" id="list">Loading...</section>
</main>
<footer>G_S demon list — animated</footer>
<button class="admin-btn" id="adminToggle">ADMIN</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBLKY1OEOA2-5eJObCjJMeKCasSLf8WmrU",
  authDomain: "gs-demonlist.firebaseapp.com",
  databaseURL: "https://gs-demonlist-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gs-demonlist",
  storageBucket: "gs-demonlist.firebasestorage.app",
  messagingSenderId: "789414584664",
  appId: "1:789414584664:web:634d9f1b5dc16f10f6c52d",
  measurementId: "G-1V7VX6QRHZ"
};
const ADMIN_UID = "fuJ0msz9njbbD2Ra85CjurHM0qR2";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const listEl = document.getElementById('list');
const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
onSnapshot(q, (snap)=>{
  if(snap.empty){ listEl.innerHTML="<article class='livello' style='opacity:1'><h2>No announcements yet.</h2></article>"; return; }
  listEl.innerHTML="";
  let i=0;
  snap.forEach(d=>{
    const data=d.data();
    const date=data.createdAt?.toDate ? data.createdAt.toDate().toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'}) : "";
    const el=document.createElement('article');
    el.className='livello';
    el.style.animationDelay=(0.2+i*0.1)+'s';
    el.innerHTML=`<div class="meta">${(data.tag||'NEWS')} • ${date}</div><h2>${data.title||''}</h2><p>${data.text||''}</p>${auth.currentUser?.uid===ADMIN_UID?`<button style="margin-top:10px;background:#220000;color:#ff7777;border:1px solid #f00;border-radius:8px;padding:6px 12px;cursor:pointer" onclick="window.delAnn('${d.id}')">Delete</button>`:''}`;
    listEl.appendChild(el);
    i++;
  });
});
window.delAnn=async(id)=>{ if(confirm("Eliminare?")) await deleteDoc(doc(db,"announcements",id)); }
document.getElementById('adminToggle').onclick=()=>{ const p=document.getElementById('adminPanel'); p.style.display=p.style.display==='none'?'block':'none'; }
document.getElementById('loginBtn').onclick=async()=>{ try{ await signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('password').value);}catch(e){document.getElementById('loginStatus').innerText=e.message;}};
document.getElementById('logoutBtn').onclick=()=>signOut(auth);
document.getElementById('publishBtn').onclick=async()=>{ const tag=document.getElementById('tag').value||"NEWS", title=document.getElementById('title').value, text=document.getElementById('text').value; if(!title||!text) return alert("Titolo e testo obbligatori"); await addDoc(collection(db,"announcements"),{tag,title,text,createdAt:serverTimestamp()}); document.getElementById('title').value=""; document.getElementById('text').value=""; };
onAuthStateChanged(auth,(user)=>{ const s=document.getElementById('loginStatus'), f=document.getElementById('postForm'), lb=document.getElementById('loginBtn'), lob=document.getElementById('logoutBtn'); if(user&&user.uid===ADMIN_UID){ s.innerText="Admin: "+user.email; f.style.display="block"; lb.style.display="none"; lob.style.display="block"; } else if(user){ s.innerText="Non sei admin"; f.style.display="none"; } else{ s.innerText="Not logged"; f.style.display="none"; lb.style.display="block"; lob.style.display="none"; } });
</script>
</body>
</html>
